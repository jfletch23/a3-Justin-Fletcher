<!doctype html>
<html lang='en'>
    <head>
        <title>Login</title>
        <meta charset='utf-8' >
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
        <link rel="stylesheet" href="css/noaccount.css">
    </head>
    <body>
        <nav>
            <div class="nav-wrapper teal accent-3">
                <a href="/" class="brand-logo left flex-logo">
                    <img src="baseball.png" alt="baseball logo">
                    <span class="yellow-text lighten-3">Baseball Prospects Database</span>
                </a>
            </div>
        </nav>
        <h1 class="header center red-text">Welcome!</h1>
        <p>Please login to continue</p>
        <form action="/login" method="POST">
            <div class="input-field">
                <input type="text" name="username" placeholder="">
                <label for="username" class="active black-text">Username</label>
            </div>
            <div class="input-field">
                <input type="password" name="password" >
                <label for="password" class="active black-text">Password</label>
            </div>
            <button class="btn waves-effect waves-light" type="submit">Submit
                <i class="material-icons right">send</i>
            </button>
        </form>
    </body>
</html>
